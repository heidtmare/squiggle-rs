[package]
name = "squiggle-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classical classifiers and model packages shared by the Squiggle app and trainer."

[dependencies]
squiggle-core = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
blake3 = { version = "1.8", features = ["pure"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
