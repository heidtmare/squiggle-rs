[package]
name = "squiggle-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classical classifiers and model packages shared by the Squiggle app and trainer."

[dependencies]
squiggle-core = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
blake3 = { version = "1.8", features = ["pure"] }
toml = "1"
# Pure-Rust CPU tensors (flex) for inference; autodiff and Adam for training.
burn = { version = "0.22", default-features = false, features = ["std", "flex", "autodiff", "optim", "safetensors"] }

tract-onnx = { version = "0.23", optional = true }

[features]
# GPU training through wgpu (Vulkan, Metal, DX12).
gpu = ["burn/wgpu"]
# Imported ONNX models on event features (tract, pure Rust).
onnx = ["dep:tract-onnx"]

[dev-dependencies]
prost = "0.14"
tempfile = "3"
