[package]
name = "squiggle-io"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Waveform readers and project persistence for Squiggle."

[dependencies]
arrow-array = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
squiggle-core = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
blake3 = { version = "1.8", features = ["pure"] }
csv = "1.4"
hound = "3.5"
# `bundled` compiles SQLite from source: no system library needed.
safetensors = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
